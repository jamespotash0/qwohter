# =====================================================
# AUTH CONFIGURATION - Rate Limiting
# Addresses vulnerabilities #1, #2, #12
# =====================================================

[auth]
# Site URL for password reset links
site_url = "env(SITE_URL)"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.external]
# Disable unused auth providers to reduce attack surface
[auth.external.azure]
enabled = false

[auth.external.bitbucket]
enabled = false

[auth.external.discord]
enabled = false

[auth.external.facebook]
enabled = false

[auth.external.figma]
enabled = false

[auth.external.github]
enabled = false

[auth.external.gitlab]
enabled = false

[auth.external.google]
enabled = false

[auth.external.kakao]
enabled = false

[auth.external.keycloak]
enabled = false

[auth.external.linkedin]
enabled = false

[auth.external.linkedin_oidc]
enabled = false

[auth.external.notion]
enabled = false

[auth.external.slack]
enabled = false

[auth.external.spotify]
enabled = false

[auth.external.twitch]
enabled = false

[auth.external.twitter]
enabled = false

[auth.external.workos]
enabled = false

[auth.external.zoom]
enabled = false

# =====================================================
# REALTIME CONFIGURATION
# Addresses vulnerability #4 (Token in URL)
# =====================================================

[realtime]
# Use headers for auth instead of URL params where possible
# Note: Some realtime features may require URL params
enabled = true

# =====================================================
# API CONFIGURATION
# Addresses vulnerabilities #7, #8
# =====================================================

[api]
# Disable OpenAPI/Swagger in production (reduces info disclosure)
# Set via environment variable for production
enabled = true

# Max rows returned per request (prevents memory exhaustion)
max_rows = 1000

# =====================================================
# STORAGE CONFIGURATION
# Addresses vulnerability #3 (Content-Type sniffing)
# =====================================================

[storage]
# Enable file type validation
enabled = true