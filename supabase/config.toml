# =====================================================
# EDGE FUNCTIONS SECURITY CONFIGURATION
# =====================================================

[functions]
# Disable gateway-level JWT verification for local dev.
# Newer Supabase CLI uses ES256 keys which the edge runtime's
# built-in verifier doesn't support (TypeError: Key for ES256 must be CryptoKey).
# Each function handles its own auth via supabase.auth.getUser().
# In production, Supabase Cloud handles gateway JWT verification separately.

[functions.ai-product-extraction]
verify_jwt = false
[functions.ai-scheduled-analysis]
verify_jwt = false
[functions.ai-workflow-agent]
verify_jwt = false
[functions.check-due-notifications]
