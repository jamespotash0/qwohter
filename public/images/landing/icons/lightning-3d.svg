<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightning-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="lightning-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="32" cy="58" rx="20" ry="4" fill="#F97316" opacity="0.15"/>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="28" fill="url(#lightning-grad)" opacity="0.15"/>

  <!-- Main Lightning Bolt -->
  <g filter="url(#glow-orange)">
    <path d="M 32 8 L 20 32 L 30 32 L 28 56 L 44 28 L 34 28 L 32 8 Z"
          fill="url(#lightning-grad)"/>

    <!-- Highlight -->
    <path d="M 32 8 L 28 20 L 30 32 L 32 32 L 32 8 Z"
          fill="url(#lightning-highlight)"/>
  </g>

  <!-- Sparkles -->
  <circle cx="18" cy="18" r="2" fill="#FED7AA" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="46" cy="22" r="2" fill="#FED7AA" opacity="0.6">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="42" r="2" fill="#FED7AA" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
