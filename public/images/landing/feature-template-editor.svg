<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg-gradient-purple)"/>

  <defs>
    <linearGradient id="bg-gradient-purple" x1="0" y1="0" x2="1600" y2="900">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="50%" stop-color="#FDF4FF"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>

    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="editor-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Container -->
  <rect x="80" y="80" width="1440" height="740" rx="24" fill="white" filter="url(#editor-shadow)"/>

  <!-- Top Toolbar -->
  <rect x="80" y="80" width="1440" height="64" rx="24" fill="#111827"/>
  <text x="120" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">Quote Template Editor</text>

  <!-- Toolbar Icons -->
  <g transform="translate(800, 98)">
    <!-- Undo -->
    <circle cx="0" cy="0" r="18" fill="white" opacity="0.1"/>
    <path d="M -6 0 L 0 -6 L 0 -2 L 4 -2 A 4 4 0 0 1 4 6 L 2 6 A 2 2 0 0 0 2 0 L 0 0 L 0 4 Z" fill="white" opacity="0.7"/>

    <!-- Redo -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="18" fill="white" opacity="0.1"/>
      <path d="M 6 0 L 0 -6 L 0 -2 L -4 -2 A 4 4 0 0 0 -4 6 L -2 6 A 2 2 0 0 1 -2 0 L 0 0 L 0 4 Z" fill="white" opacity="0.7"/>
    </g>

    <!-- Zoom -->
    <g transform="translate(120, 0)">
      <rect x="-40" y="-12" width="150" height="24" rx="12" fill="white" opacity="0.1"/>
      <text x="-10" y="6" font-family="Arial, sans-serif" font-size="12" fill="white">100%</text>
      <path d="M 40 -4 L 46 0 L 40 4" fill="white" opacity="0.7"/>
    </g>

    <!-- Device Toggle -->
    <g transform="translate(300, 0)">
      <rect x="-6" y="-10" width="12" height="20" rx="2" fill="url(#purple-pink)"/>
      <rect x="15" y="-12" width="16" height="24" rx="3" fill="white" opacity="0.3"/>
    </g>
  </g>

  <!-- Save Button -->
  <rect x="1340" y="94" width="140" height="36" rx="18" fill="url(#purple-pink)"/>
  <text x="1410" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Save Template</text>

  <!-- Left Sidebar - Design Elements -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="280" height="660" rx="16" fill="#F9FAFB"/>

    <text x="20" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Design Elements</text>

    <!-- Search -->
    <rect x="20" y="48" width="240" height="40" rx="20" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="45" y="73" font-family="Arial, sans-serif" font-size="13" fill="#9CA3AF">Search elements...</text>

    <!-- Categories -->
    <g transform="translate(20, 110)">
      <!-- Layout -->
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">LAYOUT</text>

      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="240" height="60" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
        <rect x="15" y="15" width="30" height="30" rx="4" fill="url(#purple-grad)" opacity="0.1"/>
        <rect x="20" y="20" width="20" height="20" rx="2" fill="url(#purple-grad)" opacity="0.5"/>
        <text x="60" y="32" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#111827">Header Section</text>
        <text x="60" y="48" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">Drag to add</text>
      </g>

      <!-- Text -->
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">TEXT</text>

      <g transform="translate(0, 125)">
        <rect x="0" y="0" width="240" height="60" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
        <rect x="15" y="15" width="30" height="30" rx="4" fill="url(#purple-grad)" opacity="0.1"/>
        <text x="27" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#purple-grad)">T</text>
        <text x="60" y="32" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#111827">Heading</text>
        <text x="60" y="48" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">Add text block</text>
      </g>

      <!-- Table -->
      <text x="0" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">TABLES</text>

      <g transform="translate(0, 230)">
        <rect x="0" y="0" width="240" height="60" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
        <rect x="15" y="15" width="30" height="30" rx="4" fill="url(#purple-grad)" opacity="0.1"/>
        <g transform="translate(20, 23)">
          <rect x="0" y="0" width="8" height="6" fill="url(#purple-grad)" opacity="0.5"/>
          <rect x="9" y="0" width="8" height="6" fill="url(#purple-grad)" opacity="0.5"/>
          <rect x="0" y="8" width="8" height="6" fill="url(#purple-grad)" opacity="0.5"/>
          <rect x="9" y="8" width="8" height="6" fill="url(#purple-grad)" opacity="0.5"/>
        </g>
        <text x="60" y="32" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#111827">Price Table</text>
        <text x="60" y="48" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">Line items</text>
      </g>

      <!-- Colors -->
      <text x="0" y="315" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">COLORS</text>

      <g transform="translate(0, 335)">
        <circle cx="15" cy="15" r="15" fill="#3B82F6"/>
        <circle cx="50" cy="15" r="15" fill="#8B5CF6"/>
        <circle cx="85" cy="15" r="15" fill="#EC4899"/>
        <circle cx="120" cy="15" r="15" fill="#F97316"/>
        <circle cx="155" cy="15" r="15" fill="#10B981"/>
        <circle cx="190" cy="15" r="15" fill="#111827"/>
      </g>
    </g>
  </g>

  <!-- Center Canvas Area -->
  <g transform="translate(380, 160)">
    <!-- Canvas Background -->
    <rect x="0" y="0" width="780" height="660" rx="16" fill="#F3F4F6"/>

    <!-- Grid Pattern -->
    <defs>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E7EB" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect x="40" y="40" width="700" height="580" fill="url(#grid)"/>

    <!-- Template Being Edited -->
    <rect x="80" y="80" width="620" height="500" rx="12" fill="white" filter="url(#editor-shadow)"/>

    <!-- Template Content -->
    <g transform="translate(110, 110)">
      <!-- Logo with selection handles -->
      <g>
        <rect x="0" y="0" width="80" height="80" rx="12" fill="url(#purple-grad)" opacity="0.1" stroke="#8B5CF6" stroke-width="2"/>
        <text x="40" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#8B5CF6" text-anchor="middle">Q</text>

        <!-- Selection Handles -->
        <circle cx="0" cy="0" r="6" fill="white" stroke="#8B5CF6" stroke-width="2"/>
        <circle cx="80" cy="0" r="6" fill="white" stroke="#8B5CF6" stroke-width="2"/>
        <circle cx="0" cy="80" r="6" fill="white" stroke="#8B5CF6" stroke-width="2"/>
        <circle cx="80" cy="80" r="6" fill="white" stroke="#8B5CF6" stroke-width="2"/>
      </g>

      <!-- Company Name -->
      <text x="100" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#111827">Your Company Name</text>
      <text x="100" y="52" font-family="Arial, sans-serif" font-size="13" fill="#6B7280">123 Business Street</text>
      <text x="100" y="70" font-family="Arial, sans-serif" font-size="13" fill="#6B7280">contact@company.com</text>

      <!-- Quote Title -->
      <text x="0" y="130" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#111827">PROPOSAL</text>

      <!-- Customer Section (Being Edited) -->
      <rect x="0" y="160" width="560" height="100" rx="8" fill="#F9FAFB" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="20" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6">EDITABLE SECTION</text>
      <text x="20" y="207" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Client Name</text>
      <text x="20" y="228" font-family="Arial, sans-serif" font-size="13" fill="#6B7280">Project Details</text>
      <text x="20" y="246" font-family="Arial, sans-serif" font-size="13" fill="#6B7280">Additional Information</text>

      <!-- Table Preview -->
      <g transform="translate(0, 280)">
        <rect x="0" y="0" width="560" height="36" rx="6" fill="#F3F4F6"/>
        <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7280">DESCRIPTION</text>
        <text x="360" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7280">AMOUNT</text>

        <g transform="translate(0, 46)">
          <rect x="0" y="0" width="560" height="1" fill="#E5E7EB"/>
          <text x="15" y="22" font-family="Arial, sans-serif" font-size="12" fill="#111827">Item 1</text>
          <text x="520" y="22" font-family="Arial, sans-serif" font-size="12" fill="#111827" text-anchor="end">$0.00</text>

          <rect x="0" y="32" width="560" height="1" fill="#E5E7EB"/>
          <text x="15" y="54" font-family="Arial, sans-serif" font-size="12" fill="#111827">Item 2</text>
          <text x="520" y="54" font-family="Arial, sans-serif" font-size="12" fill="#111827" text-anchor="end">$0.00</text>

          <rect x="0" y="64" width="560" height="2" fill="#111827"/>
          <text x="360" y="92" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Total:</text>
          <text x="520" y="92" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">$0.00</text>
        </g>
      </g>
    </g>

    <!-- Drag Indicator -->
    <g transform="translate(150, 250)">
      <path d="M 0 0 Q -20 -20, -40 -40" stroke="#8B5CF6" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
      <circle cx="0" cy="0" r="8" fill="#8B5CF6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#8B5CF6">Dragging...</text>
    </g>
  </g>

  <!-- Right Sidebar - Properties -->
  <g transform="translate(1180, 160)">
    <rect x="0" y="0" width="340" height="660" rx="16" fill="#F9FAFB"/>

    <text x="20" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Properties</text>

    <!-- Element Info -->
    <rect x="20" y="48" width="300" height="48" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="40" y="73" font-family="Arial, sans-serif" font-size="13" fill="#6B7280">Selected: Company Logo</text>

    <!-- Typography -->
    <g transform="translate(20, 120)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">TYPOGRAPHY</text>

      <!-- Font Family -->
      <rect x="0" y="15" width="300" height="44" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="15" y="40" font-family="Arial, sans-serif" font-size="13" fill="#111827">Inter</text>
      <path d="M 270 35 L 275 40 L 270 45" fill="#6B7280"/>

      <!-- Font Size -->
      <rect x="0" y="70" width="145" height="44" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="15" y="95" font-family="Arial, sans-serif" font-size="13" fill="#111827">16px</text>

      <!-- Font Weight -->
      <rect x="155" y="70" width="145" height="44" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="170" y="95" font-family="Arial, sans-serif" font-size="13" fill="#111827">Bold</text>
    </g>

    <!-- Color -->
    <g transform="translate(20, 255)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">COLOR</text>

      <rect x="0" y="15" width="300" height="44" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <rect x="15" y="25" width="24" height="24" rx="4" fill="#8B5CF6"/>
      <text x="50" y="44" font-family="Arial, sans-serif" font-size="13" fill="#111827">#8B5CF6</text>

      <!-- Color Gradient Toggle -->
      <rect x="0" y="70" width="300" height="44" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <rect x="15" y="80" width="70" height="24" rx="12" fill="url(#purple-pink)"/>
      <circle cx="73" cy="92" r="10" fill="white"/>
      <text x="100" y="99" font-family="Arial, sans-serif" font-size="13" fill="#111827">Gradient</text>
    </g>

    <!-- Spacing -->
    <g transform="translate(20, 400)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">SPACING</text>

      <!-- Padding -->
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Padding</text>
      <rect x="0" y="35" width="300" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="35" width="180" height="8" rx="4" fill="url(#purple-grad)"/>
      <circle cx="180" cy="39" r="12" fill="white" stroke="#8B5CF6" stroke-width="2"/>

      <!-- Margin -->
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Margin</text>
      <rect x="0" y="85" width="300" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="85" width="120" height="8" rx="4" fill="url(#purple-grad)"/>
      <circle cx="120" cy="89" r="12" fill="white" stroke="#8B5CF6" stroke-width="2"/>
    </g>

    <!-- Actions -->
    <g transform="translate(20, 540)">
      <rect x="0" y="0" width="300" height="44" rx="12" fill="url(#purple-pink)"/>
      <text x="150" y="27" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Apply Changes</text>

      <rect x="0" y="54" width="300" height="44" rx="12" fill="white" stroke="#E5E7EB" stroke-width="2"/>
      <text x="150" y="81" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">Reset</text>
    </g>
  </g>

  <!-- Live Preview Badge -->
  <g transform="translate(580, 800)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="#10B981"/>
    <circle cx="15" cy="16" r="6" fill="white">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="white">Live Preview</text>
  </g>
</svg>
