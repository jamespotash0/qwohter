<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-gradient)"/>

  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1920" y2="1080">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="50%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>

    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="green-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filters for shadows -->
    <filter id="card-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Dashboard Container -->
  <g transform="translate(160, 140)">
    <!-- Main Card with Shadow -->
    <rect x="0" y="0" width="1600" height="800" rx="24" fill="white" filter="url(#card-shadow)"/>

    <!-- Sidebar -->
    <g>
      <rect x="0" y="0" width="280" height="800" rx="24" fill="#F9FAFB"/>

      <!-- Logo Area -->
      <rect x="32" y="32" width="120" height="40" rx="8" fill="url(#blue-gradient)"/>
      <text x="92" y="58" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Qwohter</text>

      <!-- Navigation Items -->
      <g transform="translate(32, 120)">
        <!-- Dashboard (Active) -->
        <rect x="0" y="0" width="216" height="48" rx="12" fill="url(#blue-gradient)" opacity="0.1"/>
        <rect x="12" y="12" width="24" height="24" rx="6" fill="url(#blue-gradient)"/>
        <text x="48" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3B82F6">Dashboard</text>

        <!-- Quotes -->
        <g transform="translate(0, 64)">
          <rect x="12" y="12" width="24" height="24" rx="6" fill="#9CA3AF"/>
          <text x="48" y="28" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Quotes</text>
        </g>

        <!-- Analytics -->
        <g transform="translate(0, 128)">
          <rect x="12" y="12" width="24" height="24" rx="6" fill="#9CA3AF"/>
          <text x="48" y="28" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Analytics</text>
        </g>

        <!-- Forms -->
        <g transform="translate(0, 192)">
          <rect x="12" y="12" width="24" height="24" rx="6" fill="#9CA3AF"/>
          <text x="48" y="28" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Forms</text>
        </g>

        <!-- Settings -->
        <g transform="translate(0, 256)">
          <rect x="12" y="12" width="24" height="24" rx="6" fill="#9CA3AF"/>
          <text x="48" y="28" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Settings</text>
        </g>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(300, 20)">
      <!-- Header -->
      <g>
        <text x="0" y="32" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#111827">Dashboard Overview</text>
        <text x="0" y="64" font-family="Arial, sans-serif" font-size="16" fill="#6B7280">Welcome back! Here's what's happening today.</text>

        <!-- Search Bar -->
        <rect x="900" y="16" width="280" height="48" rx="24" fill="#F3F4F6"/>
        <text x="940" y="44" font-family="Arial, sans-serif" font-size="14" fill="#9CA3AF">Search...</text>

        <!-- User Avatar -->
        <circle cx="1240" cy="40" r="24" fill="url(#purple-gradient)"/>
      </g>

      <!-- Stats Cards -->
      <g transform="translate(0, 120)">
        <!-- Total Quotes Card -->
        <g filter="url(#card-shadow)">
          <rect x="0" y="0" width="280" height="140" rx="16" fill="white"/>
          <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#blue-gradient)" opacity="0.1"/>
          <circle cx="44" cy="44" r="12" fill="url(#blue-gradient)"/>
          <text x="20" y="92" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Total Quotes</text>
          <text x="20" y="120" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#111827">247</text>
          <text x="88" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#10B981">+12%</text>
        </g>

        <!-- Win Rate Card -->
        <g transform="translate(300, 0)" filter="url(#card-shadow)">
          <rect x="0" y="0" width="280" height="140" rx="16" fill="white"/>
          <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#purple-gradient)" opacity="0.1"/>
          <circle cx="44" cy="44" r="12" fill="url(#purple-gradient)"/>
          <text x="20" y="92" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Win Rate</text>
          <text x="20" y="120" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#111827">68%</text>
          <text x="80" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#10B981">+5%</text>
        </g>

        <!-- Avg Value Card -->
        <g transform="translate(600, 0)" filter="url(#card-shadow)">
          <rect x="0" y="0" width="280" height="140" rx="16" fill="white"/>
          <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#orange-gradient)" opacity="0.1"/>
          <circle cx="44" cy="44" r="12" fill="url(#orange-gradient)"/>
          <text x="20" y="92" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Avg. Value</text>
          <text x="20" y="120" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#111827">$8.5K</text>
          <text x="110" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#10B981">+8%</text>
        </g>

        <!-- Response Time Card -->
        <g transform="translate(900, 0)" filter="url(#card-shadow)">
          <rect x="0" y="0" width="280" height="140" rx="16" fill="white"/>
          <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#green-gradient)" opacity="0.1"/>
          <circle cx="44" cy="44" r="12" fill="url(#green-gradient)"/>
          <text x="20" y="92" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Response Time</text>
          <text x="20" y="120" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#111827">2.3h</text>
          <text x="98" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#10B981">-15%</text>
        </g>
      </g>

      <!-- Main Chart Card -->
      <g transform="translate(0, 280)">
        <rect x="0" y="0" width="780" height="460" rx="16" fill="white" filter="url(#card-shadow)"/>
        <text x="24" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Quote Performance</text>
        <text x="24" y="60" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Last 90 days</text>

        <!-- Chart Grid -->
        <g transform="translate(60, 100)">
          <!-- Grid Lines -->
          <line x1="0" y1="0" x2="680" y2="0" stroke="#E5E7EB" stroke-width="1"/>
          <line x1="0" y1="80" x2="680" y2="80" stroke="#E5E7EB" stroke-width="1"/>
          <line x1="0" y1="160" x2="680" y2="160" stroke="#E5E7EB" stroke-width="1"/>
          <line x1="0" y1="240" x2="680" y2="240" stroke="#E5E7EB" stroke-width="1"/>
          <line x1="0" y1="320" x2="680" y2="320" stroke="#E5E7EB" stroke-width="1"/>

          <!-- Chart Line -->
          <path d="M 0 280 Q 80 260, 170 240 T 340 160 T 510 120 T 680 80"
                stroke="url(#blue-gradient)"
                stroke-width="3"
                fill="none"
                stroke-linecap="round"/>

          <!-- Chart Fill -->
          <path d="M 0 280 Q 80 260, 170 240 T 340 160 T 510 120 T 680 80 L 680 320 L 0 320 Z"
                fill="url(#blue-gradient)"
                opacity="0.1"/>

          <!-- Data Points -->
          <circle cx="170" cy="240" r="6" fill="white" stroke="url(#blue-gradient)" stroke-width="3"/>
          <circle cx="340" cy="160" r="6" fill="white" stroke="url(#blue-gradient)" stroke-width="3"/>
          <circle cx="510" cy="120" r="6" fill="white" stroke="url(#blue-gradient)" stroke-width="3"/>
          <circle cx="680" cy="80" r="6" fill="white" stroke="url(#blue-gradient)" stroke-width="3"/>

          <!-- Y-axis labels -->
          <text x="-10" y="5" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="end">100</text>
          <text x="-10" y="85" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="end">75</text>
          <text x="-10" y="165" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="end">50</text>
          <text x="-10" y="245" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="end">25</text>
          <text x="-10" y="325" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="end">0</text>

          <!-- X-axis labels -->
          <text x="85" y="345" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Jan</text>
          <text x="255" y="345" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Feb</text>
          <text x="425" y="345" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Mar</text>
          <text x="595" y="345" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Apr</text>
        </g>
      </g>

      <!-- Activity Card -->
      <g transform="translate(800, 280)">
        <rect x="0" y="0" width="380" height="460" rx="16" fill="white" filter="url(#card-shadow)"/>
        <text x="24" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Recent Activity</text>

        <!-- Activity Items -->
        <g transform="translate(24, 70)">
          <!-- Activity 1 -->
          <circle cx="12" cy="12" r="8" fill="url(#green-gradient)" opacity="0.2"/>
          <circle cx="12" cy="12" r="4" fill="url(#green-gradient)"/>
          <rect x="32" y="0" width="300" height="48" rx="8" fill="#F9FAFB"/>
          <text x="44" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#111827">Quote #1234 accepted</text>
          <text x="44" y="36" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">2 minutes ago</text>

          <!-- Activity 2 -->
          <g transform="translate(0, 64)">
            <circle cx="12" cy="12" r="8" fill="url(#blue-gradient)" opacity="0.2"/>
            <circle cx="12" cy="12" r="4" fill="url(#blue-gradient)"/>
            <rect x="32" y="0" width="300" height="48" rx="8" fill="#F9FAFB"/>
            <text x="44" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#111827">New quote created</text>
            <text x="44" y="36" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">1 hour ago</text>
          </g>

          <!-- Activity 3 -->
          <g transform="translate(0, 128)">
            <circle cx="12" cy="12" r="8" fill="url(#orange-gradient)" opacity="0.2"/>
            <circle cx="12" cy="12" r="4" fill="url(#orange-gradient)"/>
            <rect x="32" y="0" width="300" height="48" rx="8" fill="#F9FAFB"/>
            <text x="44" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#111827">Quote #1233 viewed</text>
            <text x="44" y="36" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">3 hours ago</text>
          </g>

          <!-- Activity 4 -->
          <g transform="translate(0, 192)">
            <circle cx="12" cy="12" r="8" fill="url(#purple-gradient)" opacity="0.2"/>
            <circle cx="12" cy="12" r="4" fill="url(#purple-gradient)"/>
            <rect x="32" y="0" width="300" height="48" rx="8" fill="#F9FAFB"/>
            <text x="44" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#111827">Template updated</text>
            <text x="44" y="36" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">5 hours ago</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Floating Elements for Depth -->
  <circle cx="100" cy="100" r="60" fill="url(#blue-gradient)" opacity="0.05" filter="url(#glow)"/>
  <circle cx="1820" cy="980" r="80" fill="url(#purple-gradient)" opacity="0.05" filter="url(#glow)"/>
</svg>
