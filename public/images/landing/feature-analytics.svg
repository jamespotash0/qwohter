<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg-gradient-green)"/>

  <defs>
    <linearGradient id="bg-gradient-green" x1="0" y1="0" x2="1600" y2="900">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>

    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <linearGradient id="yellow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="analytics-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Container -->
  <rect x="80" y="80" width="1440" height="740" rx="24" fill="white" filter="url(#analytics-shadow)"/>

  <!-- Header -->
  <text x="120" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#111827">Analytics Dashboard</text>
  <text x="120" y="170" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Quote performance and insights</text>

  <!-- Date Range Selector -->
  <rect x="1260" y="110" width="220" height="48" rx="24" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1290" y="140" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Last 90 days</text>
  <path d="M 1455 133 L 1460 138 L 1455 143" fill="#6B7280"/>

  <!-- KPI Cards Row -->
  <g transform="translate(120, 200)">
    <!-- Total Quotes Card -->
    <g filter="url(#analytics-shadow)">
      <rect x="0" y="0" width="320" height="140" rx="16" fill="white"/>
      <rect x="20" y="20" width="56" height="56" rx="16" fill="url(#green-grad)" opacity="0.1"/>
      <path d="M 40 40 L 40 60 L 56 60 M 40 48 L 56 48" stroke="url(#green-grad)" stroke-width="3" stroke-linecap="round"/>
      <text x="20" y="100" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Total Quotes</text>
      <text x="20" y="128" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#111827">247</text>
      <g transform="translate(108, 110)">
        <rect x="0" y="0" width="60" height="24" rx="12" fill="#DCFCE7"/>
        <text x="12" y="16" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#16A34A">↑ 12%</text>
      </g>
    </g>

    <!-- Win Rate Card -->
    <g transform="translate(340, 0)" filter="url(#analytics-shadow)">
      <rect x="0" y="0" width="320" height="140" rx="16" fill="white"/>
      <rect x="20" y="20" width="56" height="56" rx="16" fill="url(#green-grad)" opacity="0.1"/>
      <path d="M 38 52 L 44 46 L 50 50 L 58 40" stroke="url(#green-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>
      <text x="20" y="100" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Win Rate</text>
      <text x="20" y="128" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#111827">68%</text>
      <g transform="translate(85, 110)">
        <rect x="0" y="0" width="60" height="24" rx="12" fill="#DCFCE7"/>
        <text x="15" y="16" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#16A34A">↑ 5%</text>
      </g>
    </g>

    <!-- Avg Value Card -->
    <g transform="translate(680, 0)" filter="url(#analytics-shadow)">
      <rect x="0" y="0" width="320" height="140" rx="16" fill="white"/>
      <rect x="20" y="20" width="56" height="56" rx="16" fill="url(#green-grad)" opacity="0.1"/>
      <text x="48" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#green-grad)">$</text>
      <text x="20" y="100" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Avg. Quote Value</text>
      <text x="20" y="128" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#111827">$8.5K</text>
      <g transform="translate(115, 110)">
        <rect x="0" y="0" width="60" height="24" rx="12" fill="#DCFCE7"/>
        <text x="15" y="16" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#16A34A">↑ 8%</text>
      </g>
    </g>

    <!-- Response Time Card -->
    <g transform="translate(1020, 0)" filter="url(#analytics-shadow)">
      <rect x="0" y="0" width="320" height="140" rx="16" fill="white"/>
      <rect x="20" y="20" width="56" height="56" rx="16" fill="url(#green-grad)" opacity="0.1"/>
      <circle cx="48" cy="48" r="18" stroke="url(#green-grad)" stroke-width="3" fill="none"/>
      <path d="M 48 36 L 48 48 L 56 52" stroke="url(#green-grad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="20" y="100" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Response Time</text>
      <text x="20" y="128" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#111827">2.3h</text>
      <g transform="translate(100, 110)">
        <rect x="0" y="0" width="70" height="24" rx="12" fill="#DCFCE7"/>
        <text x="12" y="16" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#16A34A">↓ 15%</text>
      </g>
    </g>
  </g>

  <!-- Main Chart Section -->
  <g transform="translate(120, 370)">
    <rect x="0" y="0" width="880" height="410" rx="16" fill="white" filter="url(#analytics-shadow)"/>

    <text x="24" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Quote Performance Trend</text>
    <text x="24" y="58" font-family="Arial, sans-serif" font-size="13" fill="#6B7280">Quotes sent, viewed, and accepted over time</text>

    <!-- Legend -->
    <g transform="translate(550, 26)">
      <circle cx="0" cy="0" r="6" fill="#10B981"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Sent</text>

      <circle cx="90" cy="0" r="6" fill="#3B82F6"/>
      <text x="105" y="5" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Viewed</text>

      <circle cx="190" cy="0" r="6" fill="#8B5CF6"/>
      <text x="205" y="5" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Accepted</text>
    </g>

    <!-- Chart Area -->
    <g transform="translate(60, 90)">
      <!-- Grid Lines -->
      <line x1="0" y1="0" x2="780" y2="0" stroke="#F3F4F6" stroke-width="1"/>
      <line x1="0" y1="65" x2="780" y2="65" stroke="#F3F4F6" stroke-width="1"/>
      <line x1="0" y1="130" x2="780" y2="130" stroke="#F3F4F6" stroke-width="1"/>
      <line x1="0" y1="195" x2="780" y2="195" stroke="#F3F4F6" stroke-width="1"/>
      <line x1="0" y1="260" x2="780" y2="260" stroke="#F3F4F6" stroke-width="1"/>

      <!-- Sent Line (Green) -->
      <path d="M 0 220 Q 97 200, 195 180 Q 292 160, 390 130 Q 487 100, 585 80 Q 682 60, 780 40"
            stroke="#10B981"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"/>
      <path d="M 0 220 Q 97 200, 195 180 Q 292 160, 390 130 Q 487 100, 585 80 Q 682 60, 780 40 L 780 260 L 0 260 Z"
            fill="url(#green-grad)"
            opacity="0.1"/>

      <!-- Viewed Line (Blue) -->
      <path d="M 0 235 Q 97 218, 195 200 Q 292 182, 390 155 Q 487 128, 585 105 Q 682 82, 780 65"
            stroke="#3B82F6"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"/>

      <!-- Accepted Line (Purple) -->
      <path d="M 0 245 Q 97 230, 195 215 Q 292 200, 390 175 Q 487 150, 585 130 Q 682 110, 780 95"
            stroke="#8B5CF6"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"/>

      <!-- Data Points -->
      <circle cx="195" cy="180" r="6" fill="white" stroke="#10B981" stroke-width="3"/>
      <circle cx="390" cy="130" r="6" fill="white" stroke="#10B981" stroke-width="3"/>
      <circle cx="585" cy="80" r="6" fill="white" stroke="#10B981" stroke-width="3"/>
      <circle cx="780" cy="40" r="6" fill="white" stroke="#10B981" stroke-width="3"/>

      <!-- Y-axis labels -->
      <text x="-10" y="5" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="end">100</text>
      <text x="-10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="end">75</text>
      <text x="-10" y="135" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="end">50</text>
      <text x="-10" y="200" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="end">25</text>
      <text x="-10" y="265" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="end">0</text>

      <!-- X-axis labels -->
      <text x="65" y="285" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">Jan</text>
      <text x="260" y="285" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">Feb</text>
      <text x="455" y="285" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">Mar</text>
      <text x="650" y="285" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">Apr</text>
    </g>
  </g>

  <!-- Conversion Funnel -->
  <g transform="translate(1020, 370)">
    <rect x="0" y="0" width="460" height="200" rx="16" fill="white" filter="url(#analytics-shadow)"/>

    <text x="24" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Conversion Funnel</text>

    <!-- Funnel Visualization -->
    <g transform="translate(24, 60)">
      <!-- Sent Stage -->
      <path d="M 0 0 L 412 0 L 372 35 L 40 35 Z" fill="url(#green-grad)" opacity="0.9"/>
      <text x="206" y="22" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Sent: 247 (100%)</text>

      <!-- Viewed Stage -->
      <path d="M 40 40 L 372 40 L 342 75 L 70 75 Z" fill="url(#emerald-grad)" opacity="0.9"/>
      <text x="206" y="62" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Viewed: 198 (80%)</text>

      <!-- Responded Stage -->
      <path d="M 70 80 L 342 80 L 322 115 L 90 115 Z" fill="#3B82F6" opacity="0.9"/>
      <text x="206" y="102" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Responded: 154 (62%)</text>

      <!-- Won Stage -->
      <path d="M 90 120 L 322 120 L 310 155 L 102 155 Z" fill="#8B5CF6" opacity="0.9"/>
      <text x="206" y="142" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Won: 168 (68%)</text>
    </g>
  </g>

  <!-- Status Breakdown Donut -->
  <g transform="translate(1020, 590)">
    <rect x="0" y="0" width="460" height="190" rx="16" fill="white" filter="url(#analytics-shadow)"/>

    <text x="24" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Quote Status</text>

    <!-- Donut Chart -->
    <g transform="translate(120, 120)">
      <!-- Won segment (68%) -->
      <path d="M 0 -60 A 60 60 0 1 1 -30 52" fill="none" stroke="url(#green-grad)" stroke-width="30"/>

      <!-- Lost segment (15%) -->
      <path d="M -30 52 A 60 60 0 0 1 -52 -30" fill="none" stroke="url(#red-grad)" stroke-width="30"/>

      <!-- Pending segment (10%) -->
      <path d="M -52 -30 A 60 60 0 0 1 -15 -58" fill="none" stroke="url(#yellow-grad)" stroke-width="30"/>

      <!-- Draft segment (7%) -->
      <path d="M -15 -58 A 60 60 0 0 1 0 -60" fill="none" stroke="#9CA3AF" stroke-width="30"/>

      <!-- Center Text -->
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#111827" text-anchor="middle">247</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Total</text>
    </g>

    <!-- Legend -->
    <g transform="translate(220, 70)">
      <g>
        <circle cx="0" cy="0" r="6" fill="#10B981"/>
        <text x="15" y="5" font-family="Arial, sans-serif" font-size="13" fill="#111827">Won</text>
        <text x="180" y="5" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="end">168 (68%)</text>
      </g>

      <g transform="translate(0, 28)">
        <circle cx="0" cy="0" r="6" fill="#EF4444"/>
        <text x="15" y="5" font-family="Arial, sans-serif" font-size="13" fill="#111827">Lost</text>
        <text x="180" y="5" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="end">37 (15%)</text>
      </g>

      <g transform="translate(0, 56)">
        <circle cx="0" cy="0" r="6" fill="#FBBF24"/>
        <text x="15" y="5" font-family="Arial, sans-serif" font-size="13" fill="#111827">Pending</text>
        <text x="180" y="5" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="end">25 (10%)</text>
      </g>

      <g transform="translate(0, 84)">
        <circle cx="0" cy="0" r="6" fill="#9CA3AF"/>
        <text x="15" y="5" font-family="Arial, sans-serif" font-size="13" fill="#111827">Draft</text>
        <text x="180" y="5" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="end">17 (7%)</text>
      </g>
    </g>
  </g>

  <!-- Real-time indicator -->
  <g transform="translate(1400, 120)">
    <circle cx="0" cy="0" r="6" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#10B981">Live</text>
  </g>
</svg>
