<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg-gradient-quote)"/>

  <defs>
    <linearGradient id="bg-gradient-quote" x1="0" y1="0" x2="1600" y2="900">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>

    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Container -->
  <rect x="80" y="80" width="1440" height="740" rx="24" fill="white" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="120" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#111827">Quote Builder</text>
  <rect x="1320" y="110" width="160" height="40" rx="20" fill="url(#orange-grad)"/>
  <text x="1400" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Generate PDF</text>

  <!-- Progress Bar -->
  <rect x="120" y="165" width="1360" height="4" rx="2" fill="#E5E7EB"/>
  <rect x="120" y="165" width="680" height="4" rx="2" fill="url(#blue-grad)"/>

  <!-- Split Layout -->
  <!-- Left Side - Form -->
  <g transform="translate(120, 200)">
    <!-- Customer Info Section -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Customer Information</text>

    <rect x="0" y="20" width="680" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Customer Name</text>
    <text x="620" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827" text-anchor="end">Acme Corporation</text>

    <rect x="0" y="90" width="680" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
    <text x="20" y="120" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Project Name</text>
    <text x="620" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827" text-anchor="end">Office Renovation</text>

    <!-- Line Items Section -->
    <text x="0" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Line Items</text>

    <!-- Line Item 1 -->
    <rect x="0" y="210" width="680" height="70" rx="12" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <text x="20" y="238" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Wall Panel Installation</text>
    <text x="20" y="258" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Qty: 50 | Unit: $120</text>

    <!-- Auto-calculated badge -->
    <rect x="520" y="225" width="140" height="28" rx="14" fill="#DBEAFE"/>
    <text x="590" y="244" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#3B82F6" text-anchor="middle">✓ Auto-calculated</text>

    <text x="640" y="248" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">$6,000</text>

    <!-- Line Item 2 -->
    <rect x="0" y="295" width="680" height="70" rx="12" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <text x="20" y="323" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Labor & Installation</text>
    <text x="20" y="343" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Qty: 40 hours | Unit: $85</text>

    <rect x="520" y="310" width="140" height="28" rx="14" fill="#DBEAFE"/>
    <text x="590" y="329" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#3B82F6" text-anchor="middle">✓ Auto-calculated</text>

    <text x="640" y="333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">$3,400</text>

    <!-- Line Item 3 -->
    <rect x="0" y="380" width="680" height="70" rx="12" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <text x="20" y="408" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Materials & Supplies</text>
    <text x="20" y="428" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Various construction materials</text>

    <rect x="520" y="395" width="140" height="28" rx="14" fill="#DBEAFE"/>
    <text x="590" y="414" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#3B82F6" text-anchor="middle">✓ Auto-calculated</text>

    <text x="640" y="418" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">$3,050</text>

    <!-- Add Item Button -->
    <rect x="0" y="465" width="680" height="48" rx="12" fill="#F0F9FF" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="340" y="494" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3B82F6" text-anchor="middle">+ Add Line Item</text>

    <!-- Pricing Summary -->
    <rect x="0" y="535" width="680" height="160" rx="12" fill="url(#blue-grad)" opacity="0.05"/>

    <g transform="translate(20, 555)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Subtotal</text>
      <text x="640" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827" text-anchor="end">$12,450</text>

      <text x="0" y="35" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Tax (8%)</text>
      <text x="640" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827" text-anchor="end">$996</text>

      <text x="0" y="70" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Discount</text>
      <text x="640" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#10B981" text-anchor="end">-$500</text>

      <line x1="0" y1="90" x2="640" y2="90" stroke="#E5E7EB" stroke-width="2"/>

      <text x="0" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Total</text>
      <text x="640" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="end">$12,946</text>
    </g>
  </g>

  <!-- Right Side - PDF Preview -->
  <g transform="translate(840, 200)">
    <!-- PDF Preview Header -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Live Preview</text>

    <!-- Toggle Buttons -->
    <rect x="420" y="-20" width="90" height="36" rx="18" fill="#3B82F6"/>
    <text x="465" y="3" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">PDF</text>

    <rect x="520" y="-20" width="90" height="36" rx="18" fill="#F3F4F6"/>
    <text x="565" y="3" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">Web</text>

    <!-- PDF Document -->
    <rect x="0" y="20" width="610" height="675" rx="12" fill="white" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow)"/>

    <!-- PDF Content -->
    <g transform="translate(40, 60)">
      <!-- Company Logo Placeholder -->
      <rect x="0" y="0" width="80" height="80" rx="12" fill="url(#blue-grad)" opacity="0.1"/>
      <text x="40" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#3B82F6" text-anchor="middle">Q</text>

      <!-- Company Info -->
      <text x="100" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">Qwohter Inc.</text>
      <text x="100" y="50" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">123 Business St, City, State 12345</text>
      <text x="100" y="68" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">contact@qwohter.com</text>

      <!-- Quote Title -->
      <text x="0" y="130" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#111827">QUOTE</text>
      <text x="0" y="160" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Quote #Q-2024-001</text>
      <text x="0" y="180" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Date: January 13, 2025</text>

      <!-- Customer Info -->
      <rect x="0" y="210" width="530" height="90" rx="8" fill="#F9FAFB"/>
      <g transform="translate(20, 230)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">BILL TO:</text>
        <text x="0" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Acme Corporation</text>
        <text x="0" y="40" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Office Renovation Project</text>
        <text x="0" y="56" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">contact@acme.com</text>
      </g>

      <!-- Line Items Table -->
      <g transform="translate(0, 320)">
        <!-- Table Header -->
        <rect x="0" y="0" width="530" height="36" rx="6" fill="#F3F4F6"/>
        <text x="10" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7280">DESCRIPTION</text>
        <text x="320" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7280">QTY</text>
        <text x="400" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7280">RATE</text>
        <text x="480" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end">AMOUNT</text>

        <!-- Table Rows -->
        <g transform="translate(0, 46)">
          <text x="10" y="0" font-family="Arial, sans-serif" font-size="12" fill="#111827">Wall Panel Installation</text>
          <text x="320" y="0" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">50</text>
          <text x="400" y="0" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">$120</text>
          <text x="510" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#111827" text-anchor="end">$6,000</text>
        </g>

        <g transform="translate(0, 70)">
          <text x="10" y="0" font-family="Arial, sans-serif" font-size="12" fill="#111827">Labor & Installation</text>
          <text x="320" y="0" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">40</text>
          <text x="400" y="0" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">$85</text>
          <text x="510" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#111827" text-anchor="end">$3,400</text>
        </g>

        <g transform="translate(0, 94)">
          <text x="10" y="0" font-family="Arial, sans-serif" font-size="12" fill="#111827">Materials & Supplies</text>
          <text x="320" y="0" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">-</text>
          <text x="400" y="0" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">-</text>
          <text x="510" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#111827" text-anchor="end">$3,050</text>
        </g>

        <!-- Totals -->
        <line x1="0" y1="130" x2="530" y2="130" stroke="#E5E7EB" stroke-width="1"/>

        <g transform="translate(0, 150)">
          <text x="350" y="0" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Subtotal:</text>
          <text x="510" y="0" font-family="Arial, sans-serif" font-size="12" fill="#111827" text-anchor="end">$12,450</text>

          <text x="350" y="24" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Tax (8%):</text>
          <text x="510" y="24" font-family="Arial, sans-serif" font-size="12" fill="#111827" text-anchor="end">$996</text>

          <text x="350" y="48" font-family="Arial, sans-serif" font-size="12" fill="#10B981">Discount:</text>
          <text x="510" y="48" font-family="Arial, sans-serif" font-size="12" fill="#10B981" text-anchor="end">-$500</text>

          <line x1="320" y1="60" x2="530" y2="60" stroke="#111827" stroke-width="2"/>

          <text x="350" y="88" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">Total:</text>
          <text x="510" y="88" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827" text-anchor="end">$12,946</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Lightning Bolt Icon (Speed Indicator) -->
  <g transform="translate(760, 120)">
    <circle cx="20" cy="20" r="32" fill="url(#orange-grad)" opacity="0.15"/>
    <path d="M 20 6 L 14 20 L 20 20 L 20 34 L 26 20 L 20 20 Z" fill="url(#orange-grad)"/>
  </g>

  <!-- Sync Indicator -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="8" fill="#10B981"/>
    <circle cx="0" cy="0" r="14" fill="#10B981" opacity="0.2">
      <animate attributeName="r" values="14;18;14" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
